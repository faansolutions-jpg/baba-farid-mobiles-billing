# Baba Farid Mobiles — Render Blueprint (free tier)
# Deploy with: Render Dashboard -> New -> Blueprint -> connect the GitHub repo
# containing this file. Render creates the web service + PostgreSQL below.
# Docs: https://render.com/docs/blueprint-spec
#
# FREE TIER NOTES:
# - Web service (free): spins down after 15 min of inactivity; first request
#   after idle takes ~30-60s to wake. 750 hours/month free.
# - PostgreSQL (free): expires after 90 days, 1 GB storage. Before it
#   expires, upgrade to the paid plan or back up the DB and recreate it.
# - JWT secrets are auto-generated by Render (generateValue: true) and stored
#   as env vars on the service — they are never written into this repo.
# - LOGIN_RATE_LIMIT_MAX=5 (production default, no dev override).

services:
  - type: web
    name: baba-farid-mobiles-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build && apt-get update -qq && apt-get install -y -qq postgresql-client > /dev/null 2>&1 || true
    startCommand: node dist/server.js
    preDeployCommand: bash ../scripts/render-migrate.sh
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: baba-farid-mobiles-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: 12
      - key: LOGIN_RATE_LIMIT_MAX
        value: 5

databases:
  - name: baba-farid-mobiles-db
    plan: free
    postgresMajorVersion: 16
